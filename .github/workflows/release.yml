# Releases every push to main (that is, every merge): tests, picks the next
# version from the commits (scripts/next-version.sh), builds Lieferling for
# macOS and publishes a GitHub release with the DMG and the command line.
# Lieferling can then manage its own updates: add pklaschka/lieferling to its list.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write # the OIDC token Sigstore signs the build attestation for
  attestations: write # store the attestations with the repository

# one release at a time, in merge order
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # tags and history for the version
      - name: Next version
        id: version
        run: |
          version="$(scripts/next-version.sh)"
          if [ -z "$version" ]; then
            echo "Nothing new since the last release."
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v6
        if: steps.version.outputs.version != ''
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        if: steps.version.outputs.version != ''
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Test
        if: steps.version.outputs.version != ''
        run: go test ./internal/... ./cmd/...
      - name: Install Wails
        if: steps.version.outputs.version != ''
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Stamp the version into the app
        if: steps.version.outputs.version != ''
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" build/darwin/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VERSION" build/darwin/Info.plist
      - name: Build the app (universal) and its DMG
        if: steps.version.outputs.version != ''
        run: |
          wails3 task darwin:package:universal
          wails3 task darwin:create:dmg
          mkdir -p dist
          mv bin/*.dmg "dist/Lieferling-$VERSION-universal.dmg"
          ditto -c -k --keepParent bin/Lieferling.app "dist/Lieferling-$VERSION-mac-universal.zip"
      - name: Build the command line
        if: steps.version.outputs.version != ''
        run: |
          for arch in arm64 amd64; do
            GOOS=darwin GOARCH=$arch go build -ldflags "-s -w" -o lieferling ./cmd/lieferling
            tar -czf "dist/lieferling-cli-$VERSION-darwin-$arch.tar.gz" lieferling
          done
      # before publishing, so a release never appears without its attestations;
      # Lieferling checks them at customs (lieferling verify pklaschka/lieferling)
      - name: Attest the release files
        if: steps.version.outputs.version != ''
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*
      - name: Publish the release
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # a draft first, so Lieferling never sees a release without its files
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" \
            --generate-notes --draft dist/*
          gh release edit "v$VERSION" --draft=false --latest
